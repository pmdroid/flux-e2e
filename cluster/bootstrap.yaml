apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap
  namespace: flux-system
spec:
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  interval: 10m0s
  path: ./0-bootstrap
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s