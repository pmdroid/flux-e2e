apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  timeout: 15m
  values:
    controller:
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        extra:
          - name: journal
            hostPath:
              path: /var/log/journal
              type: DirectoryOrCreate # create dir if it doesn't exist else alloy config will complain about it missing
    alloy:
      extraArgs:
        - --stability.level=experimental
      resources:
        requests:
          cpu: 400m
          memory: 800Mi
        limits:
          cpu: 600m
          memory: 1000Mi
      enableReporting: false
      securityContext:
        privileged: true
        runAsUser: 0
      clustering:
        enabled: true
      configMap:
        create: false
        name: alloy
        key: config
      serviceMonitor:
        enabled: true
      mounts:
        extra:
          - name: journal
            mountPath: /var/log/journal
            readOnly: true
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana
      version: 1.1.2
  interval: 10m0s
