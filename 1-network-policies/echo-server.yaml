apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: echo-server
  namespace: echo-server
  annotations:
    description: "Allow Tailscale to access the echo-server."
spec:
  podSelector:
    matchLabels:
      app: echo-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 80
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network-tools
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: echo-server
              tailscale.com/parent-resource-type: ingress
