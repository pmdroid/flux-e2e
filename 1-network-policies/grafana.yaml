apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    description: "Allow Tailscale and monitoring pods to access Grafana. Allow Grafana to access any monitoring pod, any external IP address, and the CoreDNS pod"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 3000
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network-tools
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: grafana
              tailscale.com/parent-resource-type: ingress
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
    - to:
        - namespaceSelector: { }
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
